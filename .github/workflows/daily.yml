name: Búsqueda diaria de licitaciones

on:
  schedule:
    # 8am Argentina (UTC-3) = 11:00 UTC
    - cron: '0 11 * * *'
  workflow_dispatch:
    # Permite ejecutar manualmente desde GitHub Actions

jobs:
  buscar-licitaciones:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install anthropic

      - name: Ejecutar búsqueda de licitaciones
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python buscar_licitaciones.py

      - name: Guardar resultados en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "INSUCOM Bot"
          git add resultados.json
          git diff --staged --quiet || git commit -m "🔍 Licitaciones actualizadas $(date +'%d/%m/%Y')"
          git push
